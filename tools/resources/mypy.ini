# More details: https://mypy.readthedocs.io/en/stable/config_file.html
# Paths are relative to this file (tools/resources/).
# Target packages are passed on the CLI by tools/devtools/mypy.py (absolute paths).

[mypy]

# -- types ---
check_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_configs = True

# --- errors ---
ignore_errors = False

# --- imports ----
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
mypy_path = ../../src:../../libs/rag-core/src:../../apps/papers-rag/src:../../projects/papers-ingest/src
follow_imports = normal
follow_imports_for_stubs = True
no_site_packages = True

# --- platform ---
python_version = 3.13
platform = darwin

# --- strictness ---
strict = False
show_traceback = True
raise_exceptions = True

# --- error messages ---
color_output = True
error_summary = True
pretty = True
show_column_numbers = True
show_error_codes = True
show_absolute_path = False

# --- excludes ---
exclude = (?x)(^\.venv/|^build/|^dist/|^site/|^\.tox/|^.*/docs/_build/)
