# https://docs.pytest.org/en/stable/reference/customize.html

[pytest]
testpaths =
    tests
    libs/rag-core/tests
    apps/papers-rag/tests
    projects/papers-ingest/tests
pythonpath =
    src
    libs/rag-core/src
    apps/papers-rag/src
    projects/papers-ingest/src
markers =
    slow: end-to-end or long-running tests
    needs_openai: tests that call the OpenAI API
    needs_embed: tests that download / run embedding models
    integration: integration tests against real boundaries
