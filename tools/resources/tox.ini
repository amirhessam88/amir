[tox]
requires =
    tox>=4.22
    tox-uv>=1.25
envlist = py{311,312,313}
skip_missing_interpreters = True
# Config lives under tools/resources/; keep .tox and commands at repo root.
work_dir = {toxinidir}/../../.tox

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    dev
    docs
uv_python_preference = only-managed
package = workspace
package_root = {toxinidir}/../..
change_dir = {toxinidir}/../..
allowlist_externals =
    uv
    poe
commands =
    poe check
    poe test
