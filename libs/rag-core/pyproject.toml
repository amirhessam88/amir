[project]
name = "rag-core"
version = "0.1.0"
description = "Shared RAG primitives: ingest, Chroma index, LlamaIndex query, citations"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amirhessam Tahmassebi", email = "amirhessam.github@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "llama-index>=0.12.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-llms-openai>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/amirhessam88/amir"
Documentation = "https://amirhessam88.github.io/amir/rag-core/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
