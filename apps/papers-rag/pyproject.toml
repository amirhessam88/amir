[project]
name = "papers-rag"
version = "0.1.0"
description = "Streamlit chat UI over the papers Chroma index"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amirhessam Tahmassebi", email = "amirhessam.github@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "rag-core>=0.1.0",
    "streamlit>=1.37",
    "python-dotenv>=1.0",
]

[project.scripts]
papers-rag = "papers_rag.app:run"

[project.urls]
Homepage = "https://github.com/amirhessam88/amir"
Documentation = "https://amirhessam88.github.io/amir/papers-rag/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_rag"]

[tool.uv.sources]
rag-core = { workspace = true }
