[project]
name = "papers-ingest"
version = "0.1.1"
description = "CLI to ingest research PDFs into the local Chroma papers index"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amirhessam Tahmassebi", email = "amirhessam.github@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "rag-core>=0.1.1",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
papers-ingest = "papers_ingest.cli:main"

[project.urls]
Homepage = "https://github.com/amirhessam88/amir"
Documentation = "https://amirhessam88.github.io/amir/papers-ingest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_ingest"]

[tool.uv.sources]
rag-core = { workspace = true }
