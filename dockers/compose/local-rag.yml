# Local Papers RAG stack (LlamaIndex / LangChain + Streamlit).
# Usage (from repo root):
#   docker compose -f dockers/compose/local-rag.yml up --build
# Langflow is a separate studio: poe run-langflow (uv tool; Docker optional)
services:
  papers-rag:
    build:
      context: ../..
      dockerfile: dockers/templates/streamlit-app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_DIR: /data/indexes/llamaindex
      PAPERS_DIR: /app/assets/pdf/papers
    volumes:
      - ../../.data/indexes:/data/indexes
